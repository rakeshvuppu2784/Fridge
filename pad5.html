<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110F">
<title>Fridge (Desk v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { color-scheme: dark; --cream: #F3ECDF; --dim: #C3CBD6; --gold: #F2B84F; --ink: #17130F; --surf: rgba(255,255,255,.07); --serif: Fraunces, Georgia, serif; --u: 8.6px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14110F; overflow: hidden; font-family: Inter, system-ui, -apple-system, sans-serif; color: var(--cream);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
  .tn { font-variant-numeric: tabular-nums; }
  svg.ic { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  #stage { position: absolute; top: 0; left: 0; width: 1204px; height: 860px; transform-origin: 0 0; background: #14110F; overflow: hidden; }
  #sky { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #1B2A3D, #25394F 50%, #33506A); }
  #sky::after { content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(10,9,8,.14), rgba(10,9,8,.5)); }
  .grid { position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: calc(var(--u)*5) calc(var(--u)*5) calc(64px + var(--u)*2); display: grid; grid-template-columns: minmax(0, 1fr) calc(var(--u)*52); gap: calc(var(--u)*3); }
  .left { display: flex; flex-direction: column; gap: calc(var(--u)*5); min-width: 0; min-height: 0; }

  /* A. header */
  .hd { display: flex; align-items: flex-start; gap: 24px; }
  .hd > div:first-child { position: relative; z-index: 5; min-width: calc(var(--u)*37.5); }   /* fits "12:59", so the family grid never shifts with the clock width */
  .clock { font-family: var(--serif); font-variation-settings: 'opsz' 48; font-weight: 300; font-size: calc(var(--u)*17); line-height: 1; letter-spacing: calc(var(--u)*-.35); white-space: nowrap; }
  .date { font-size: calc(var(--u)*2.6); color: var(--dim); margin-top: calc(var(--u)*.6); white-space: nowrap; }
  .hw { position: absolute; left: calc(var(--u)*5); bottom: calc(var(--u)*17); z-index: 5; display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u)*1.4); }
  .wt { display: flex; align-items: center; gap: 12px; }
  .we { font-size: 64px; line-height: 1; }
  .wd { font-family: var(--serif); font-variation-settings: 'opsz' 48; font-weight: 300; font-size: calc(var(--u)*12); line-height: 1; letter-spacing: -2px; }
  .bds { display: flex; gap: calc(var(--u)*.8); align-items: center; justify-content: flex-start; }
  .bdg { display: inline-flex; align-items: center; gap: calc(var(--u)*.8); height: calc(var(--u)*4.2); padding: 0 calc(var(--u)*1.6) 0 calc(var(--u)*1.2); border-radius: calc(var(--u)*2.1); font-size: calc(var(--u)*3); font-weight: 500; color: var(--cream); }

  /* B. hero */
  .hero { position: relative; z-index: 5; display: grid; grid-template-columns: calc(var(--u)*9) minmax(0, 1fr); column-gap: calc(var(--u)*2); align-items: start; min-height: calc(var(--u)*9); }
  .fam { position: relative; z-index: 5; display: grid; --av: calc(var(--u)*13); grid-template-columns: repeat(2, calc(var(--av) + var(--u)*2.4)); grid-auto-rows: calc(var(--av) + var(--u)*4.4); column-gap: calc(var(--u)*1.5); row-gap: 0; justify-items: center; align-items: start; margin-left: calc(var(--u)*2); }
  .fam[hidden] { display: none; }
  .fam .pp { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*1); }
  .fam .av { position: relative; width: var(--av); height: var(--av); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--u)*3); font-weight: 600; }
  .fam .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .fam .bd { position: absolute; right: calc(var(--av)*-.14); bottom: calc(var(--av)*-.09); width: calc(var(--av)*.46); height: calc(var(--av)*.46); border-radius: 50%; background: transparent; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); display: flex; align-items: center; justify-content: center; font-size: calc(var(--u)*2.6); }
  .fam .since { font-size: calc(var(--u)*3); color: #C3CBD6; white-space: nowrap; }
  .fam .stale { opacity: .45; }
  .tile { width: calc(var(--u)*9); height: calc(var(--u)*9); border-radius: calc(var(--u)*2); display: flex; align-items: center; justify-content: center; }
  .te { font-size: calc(var(--u)*4.2); line-height: 1; }
  .td { display: block; width: 22px; height: 22px; border-radius: 11px; }
  .ht { min-width: 0; }
  .htitle { font-family: var(--serif); font-variation-settings: 'opsz' 48; font-weight: 400; font-size: calc(var(--u)*7); line-height: 1.1; letter-spacing: calc(var(--u)*-.1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hmeta { display: flex; align-items: center; gap: calc(var(--u)*1.6); font-size: calc(var(--u)*3); color: var(--dim); margin-top: calc(var(--u)*1); min-height: calc(var(--u)*4.2); white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; height: calc(var(--u)*4.2); padding: 0 calc(var(--u)*1.6); border-radius: calc(var(--u)*2.1); background: var(--gold); color: var(--ink); font-weight: 500; font-size: calc(var(--u)*3.6); }
  .pill.dim { background: rgba(255,255,255,.14); color: var(--dim); }
  .dots { display: inline-flex; align-items: center; }
  .dots i { display: block; border-radius: 50%; box-shadow: 0 0 0 2px rgba(20,17,15,.55); }
  .dots i + i { margin-left: -8px; }

  /* C. day ribbon */
  .ribbon { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; overflow: hidden; background: rgba(8,10,24,.62); z-index: 7; }
  .rday { position: absolute; top: 0; bottom: 0; background: linear-gradient(90deg, rgba(240,128,92,.66), rgba(250,208,120,.6) 50%, rgba(232,112,100,.66));
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .blk { position: absolute; display: flex; align-items: center; gap: 6px; padding: 0 3px; border-radius: 22px; overflow: hidden; white-space: nowrap; color: var(--ink); font-size: calc(var(--u)*2.6); font-weight: 500; }
  .blk .be { font-size: calc(var(--u)*2.6); line-height: 1; }
  .rdot { position: absolute; bottom: 1px; width: 4px; height: 4px; border-radius: 2px; background: rgba(243,236,223,.42); transform: translateX(-50%); }
  .sun { position: absolute; top: 32px; width: 0; height: 0; z-index: 3; }
  .sun .gl { position: absolute; left: -36px; top: -36px; width: 72px; height: 72px; border-radius: 36px; animation: glow 4s ease-in-out infinite; }
  .sun svg { position: absolute; left: -12px; top: -12px; }

  /* D. agenda card */
  .chips { display: flex; flex-wrap: nowrap; gap: calc(var(--u)*1); min-width: 0; overflow: hidden; }
  .chip { display: inline-flex; align-items: center; gap: calc(var(--u)*1); height: calc(var(--u)*5.6); padding: 0 calc(var(--u)*1.6); border-radius: calc(var(--u)*2.8); background: var(--surf); font-size: calc(var(--u)*3); white-space: nowrap; min-width: 0; flex: 0 1 auto; overflow: hidden; }
  .chip .ct { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .chip .tag { font-weight: 500; color: var(--dim); flex-shrink: 0; }
  .chip .be { font-size: calc(var(--u)*3); line-height: 1; flex-shrink: 0; }
  .chip.more { color: var(--dim); flex-shrink: 0; }
  .wo { display: flex; align-items: flex-start; gap: calc(var(--u)*1.2); padding: calc(var(--u)*1.4) calc(var(--u)*1.8); border-radius: calc(var(--u)*2); background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.14); font-size: calc(var(--u)*3.2); line-height: 1.25; color: var(--cream); white-space: normal; min-width: 0; }
  .wo .wt { white-space: normal; overflow-wrap: anywhere; min-width: 0; }
  .wo:empty { display: none; }
  .meals { display: flex; flex-direction: column; gap: calc(var(--u)*.5); min-width: 0; }
  .meals:empty { display: none; }
  .mrow { display: flex; align-items: center; gap: calc(var(--u)*1.4); height: calc(var(--u)*4.2); font-size: calc(var(--u)*3.6); min-width: 0; }
  .mrow > span:first-child { flex-shrink: 0; }
  .mv { color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* E. countdown rings */
  .rings { display: flex; gap: calc(var(--u)*1); align-items: flex-start; }
  .rings:empty { display: none; }
  .ring { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*1); }
  .rg { position: relative; width: calc(var(--u)*8); height: calc(var(--u)*8); }
  .rg svg { display: block; width: 100%; height: 100%; }
  .rn { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 400; font-size: calc(var(--u)*3.6); line-height: 1; }
  .rn.sm { font-family: Inter, system-ui, sans-serif; font-size: calc(var(--u)*2.6); font-weight: 500; }
  .rp { position: absolute; width: 16px; height: 16px; border-radius: 8px; }
  .rl { font-size: calc(var(--u)*2.6); line-height: 1.2; color: var(--dim); text-align: center; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* night: clock, moon ribbon, tomorrow's first event */
  .night .tray { display: none; }

  /* scene: the window above the horizon ribbon */
  .scene { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 0; overflow: hidden; background: #0E1630; }
  .scene::after { content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 64px; z-index: 3; pointer-events: none; background: linear-gradient(180deg, rgba(8,10,20,.44), rgba(8,10,20,.66)); }
  .sl { position: absolute; left: 0; top: 0; right: 0; bottom: 64px; pointer-events: none; }
  .sc-sky { bottom: 0; }
  .sc-body { position: absolute; width: 0; height: 0; z-index: 4; }
  .sc-body i, .sc-body svg { position: absolute; display: block; }
  .sc-body .bgl { left: -220px; top: -220px; width: 440px; height: 440px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--sc),.5) 0, rgba(var(--sc),.16) 36%, rgba(var(--sc),0) 68%); animation: glow 6s ease-in-out infinite; opacity: var(--mg, 1); }
  .sc-body .bco { left: -58px; top: -58px; width: 116px; height: 116px; border-radius: 50%; }
  .sc-body svg { left: -54px; top: -54px; }
  .sc-stars i { position: absolute; border-radius: 50%; background: linear-gradient(#F3ECDF, #F3ECDF); }
  .sc-clouds { overflow: hidden; }
  .cloud { position: absolute; left: 0; width: 300px; height: 110px; opacity: var(--o); transform: translateX(-340px) scale(var(--s)); animation: drift linear infinite; will-change: transform;
    background: radial-gradient(closest-side, rgba(var(--cr),.95), rgba(var(--cr),0)) 0% 70% / 40% 70% no-repeat, radial-gradient(closest-side, rgba(var(--cr),1), rgba(var(--cr),0)) 28% 18% / 46% 88% no-repeat,
      radial-gradient(closest-side, rgba(var(--cr),.95), rgba(var(--cr),0)) 58% 55% / 40% 72% no-repeat, radial-gradient(closest-side, rgba(var(--cr),.8), rgba(var(--cr),0)) 92% 80% / 30% 56% no-repeat; }
  @keyframes drift { from { transform: translateX(-340px) scale(var(--s)); } to { transform: translateX(calc(var(--sw) + 40px)) scale(var(--s)); } }
  .sc-over { background: #4E586B; opacity: 0; }
  .sc-fog { background: rgba(215,220,228,.22); }
  .sc-fog i { position: absolute; left: -10%; width: 120%; height: 96px; background: linear-gradient(to bottom, rgba(225,230,236,0), rgba(225,230,236,.42), rgba(225,230,236,0)); animation: fogdrift 40s ease-in-out infinite alternate; }
  @keyframes fogdrift { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
  .sc-rain { bottom: auto; width: 100%; height: calc(100% - 64px); }
  .sc-haze { background: linear-gradient(to top, rgba(214,146,76,.95), rgba(214,146,76,0) 90%); opacity: 0; }
  .sc-flash { background: #DCE8FF; opacity: 0; }
  .sc-flash.go { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 8% { opacity: .16; } 18% { opacity: .03; } 28% { opacity: .11; } 100% { opacity: 0; } }
  .sc-city { top: auto; bottom: 64px; height: 0; z-index: 5; }
  .sc-fog, .sc-rain, .sc-haze, .sc-flash { z-index: 6; }
  .still .scene *, .night .scene *, .hush .scene * { animation-play-state: paused !important; }

  /* the agenda card: solid, shrinks to its rows */
  .tray { position: relative; flex: 0 0 auto; min-height: 0; padding: calc(var(--u)*2.4); border-radius: calc(var(--u)*3); background: rgba(16,18,28,.82); display: flex; flex-direction: column; gap: calc(var(--u)*1.4); z-index: 2; }
  .tray .chips:empty { display: none; }
  .tray .rings:empty { display: none; }

  /* F. photo */
  .rcol { position: relative; z-index: 5; display: flex; flex-direction: column; gap: calc(var(--u)*4); min-width: 0; }
  .photo { position: relative; flex: 1 1 0; min-height: calc(var(--u)*30); border-radius: calc(var(--u)*3); overflow: hidden; background: #2A241F; }
  .ph { position: absolute; left: 0; top: 0; right: 0; bottom: 0; opacity: 0; transition: opacity 1.4s ease; }
  .ph.show { opacity: 1; }
  .ph-fg { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-size: cover; background-position: center 30%; background-repeat: no-repeat; }
  .ph-shade { position: absolute; left: 0; right: 0; top: 0; height: 96px; background: linear-gradient(to bottom, rgba(10,8,6,.55), rgba(10,8,6,0)); pointer-events: none; }
  .ph-cap { position: absolute; left: calc(var(--u)*2.2); top: calc(var(--u)*2.2); font-size: calc(var(--u)*2.6); line-height: 1.2; color: var(--cream); padding: calc(var(--u)*.5) calc(var(--u)*1.6); border-radius: calc(var(--u)*2); background: rgba(12,10,9,.72); }
  .ph-cap:empty { display: none; }
  .ph-dots { position: absolute; right: calc(var(--u)*2.6); top: calc(var(--u)*3); display: flex; gap: 5px; }
  .ph-dots span { width: 5px; height: 5px; border-radius: 3px; background: rgba(244,238,228,.45); }
  .ph-dots span.on { width: 16px; background: linear-gradient(var(--cream), var(--cream)); }
  .ph-empty { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: calc(var(--u)*2.6); color: #C3CBD6; text-align: center; padding: 20px; }

  #inter { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 6; background: #0C0A09; opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s .9s; }
  #inter.on { opacity: 1; visibility: visible; transition: opacity .9s ease; }
  #inter .imgs, #inter .imgs > div { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  #inter .ibg { background-size: cover; background-position: center; filter: brightness(.5); }
  #inter .ifg { background-position: center; background-repeat: no-repeat; }
  #inter .ifg.land { background-size: cover; animation: pan 34s ease-out forwards; }
  #inter .ifg.port { background-size: contain; }
  #inter .shade-t { position: absolute; left: 0; top: 0; right: 0; height: 200px; background: linear-gradient(to bottom, rgba(10,8,7,.7), rgba(10,8,7,0)); }
  #inter .shade-b { position: absolute; left: 0; bottom: 0; right: 0; height: 360px; background: linear-gradient(to top, rgba(10,8,7,.88), rgba(10,8,7,0)); }
  #inter .ibar { position: absolute; left: 0; bottom: 0; height: 6px; width: 100%; background: rgba(255,255,255,.14); }
  #inter .ibar i { display: block; height: 6px; background: var(--gold); animation: bar 30s linear forwards; }
  @keyframes pan { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.14) translate(-2.5%, -2%); } }
  @keyframes bar { from { width: 0; } to { width: 100%; } }
  @keyframes fall { from { transform: translateY(-40px) rotate(0deg); } to { transform: translateY(940px) rotate(600deg); } }
  @keyframes glow { 0%, 100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }
  #confetti { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 7; pointer-events: none; overflow: hidden; }
  #confetti i { position: absolute; top: 0; opacity: .92; animation: fall linear infinite; }

  #dim { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2s; z-index: 8; }
  .status { position: absolute; right: 18px; bottom: 8px; font-size: calc(var(--u)*2.6); color: var(--cream); z-index: 7; }
  .banner { position: absolute; left: 0; right: 0; top: 0; padding: 6px 48px; font-size: calc(var(--u)*2.6); background: #3A2A10; color: #F2C27A; z-index: 9; }
  @media (prefers-reduced-motion: reduce) { .ph { transition: none; } #inter .ifg.land { animation: none; } * { animation-duration: 0s !important; } }
  /* DESK TYPE SCALE: desk viewing distance (~60 cm) needs smaller type than a fridge. These override the sizes above; tune here only. */
  .clock { font-size: calc(var(--u)*12.5); }
  .date { font-size: calc(var(--u)*2.2); }
  .we { font-size: 46px; }
  .wd { font-size: calc(var(--u)*8.5); }
  .bdg { font-size: calc(var(--u)*2.3); }
  .fam .av { font-size: calc(var(--u)*2.4); }
  .fam .bd { font-size: calc(var(--av)*.36); }
  .fam .since { font-size: calc(var(--u)*2.5); }
  .te { font-size: calc(var(--u)*3.4); }
  .htitle { font-size: calc(var(--u)*5.2); }
  .hmeta { font-size: calc(var(--u)*2.3); }
  .pill { font-size: calc(var(--u)*2.8); }
  .blk, .blk .be { font-size: calc(var(--u)*2.1); }
  .chip, .chip .be { font-size: calc(var(--u)*2.3); }
  .wo { font-size: calc(var(--u)*2.5); }
  .mrow, .rn { font-size: calc(var(--u)*2.8); }
  .rn.sm, .rl { font-size: calc(var(--u)*2.1); }
  .ph-cap, .ph-empty, .status, .banner { font-size: calc(var(--u)*2.1); }
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div class="grid">
    <div class="left">
      <div class="hd">
        <div><div class="clock tn js-clock"></div><div class="date js-date"></div></div>
        <div class="fam js-fam" hidden></div>
        <div class="hw js-wx"></div>
      </div>
      <div class="hero js-hero"></div>
    </div>
    <div class="rcol">
    <div class="photo js-photo">
      <div class="ph js-ph-a"><div class="ph-fg"></div></div>
      <div class="ph js-ph-b"><div class="ph-fg"></div></div>
      <div class="ph-empty js-ph-empty">Add photos to the Drive folder to fill this frame</div>
      <div class="ph-shade"></div>
      <div class="ph-cap js-ph-cap"></div>
      <div class="ph-dots js-ph-dots"></div>
    </div>
      <div class="tray js-tray">
        <div class="meals js-meals"></div>
        <div class="chips js-chips"></div>
        <div class="wo js-wo"></div>
        <div class="rings js-rings"></div>
      </div>
    </div>
  </div>
  <div class="scene js-scene">
    <div class="sl sc-sky js-sc-sky"></div>
    <div class="sl sc-stars js-sc-stars"></div>
    <div class="sc-body js-sc-body"></div>
    <svg class="sl sc-city js-sc-city" aria-hidden="true"></svg>
    <div class="sl sc-clouds js-sc-clouds"></div>
    <div class="sl sc-over js-sc-over"></div>
    <div class="sl sc-fog js-sc-fog" style="display:none"><i style="top:22%"></i><i style="top:48%"></i><i style="top:72%"></i></div>
    <canvas class="sl sc-rain js-sc-rain"></canvas>
    <div class="sl sc-haze js-sc-haze"></div>
    <div class="sl sc-flash js-sc-flash"></div>
    <div class="ribbon js-ribbon"></div>
  </div>

  <div id="inter">
    <div class="imgs js-inter-imgs"></div>
    <div class="shade-t"></div><div class="shade-b"></div>
    <div class="tn js-i-clock" style="position:absolute;left:48px;top:36px;font-family:var(--serif);font-size:64px;line-height:1"></div>
    <div class="js-i-wx" style="position:absolute;right:48px;top:40px;display:flex;align-items:center;gap:12px"></div>
    <div style="position:absolute;left:48px;bottom:64px"><div class="js-i-sub" style="font-size:28px;color:#E6DFD2"></div><div class="js-i-title" style="font-family:var(--serif);font-size:72px;line-height:80px;letter-spacing:-1px"></div></div>
    <div class="js-i-next" style="position:absolute;right:48px;bottom:72px;display:flex;align-items:center;gap:14px;font-size:28px;color:#EDE6DA"></div>
    <div class="ibar js-i-bar"></div>
  </div>
  <div id="confetti"></div>
  <div id="dim"></div>
  <div class="status js-status"></div>

</div>

<script>
(() => {
  // ---------- Settings ----------
  const LAT_DEFAULT = 17.465, LON_DEFAULT = 78.361;     // Kondapur, Hyderabad
  const NIGHT_FROM = 22, NIGHT_TO = 6;                   // dim / pause photo extras between these hours
  const DAY_LEVEL = -1, NIGHT_LEVEL = 25, NIGHT_CAP = 60; // Fully brightness: 0-255, -1 = device default
  const F = (typeof window.fully !== 'undefined') ? window.fully : null;
  const RAIN_NUDGE = 60, HOT_NUDGE = 38, AQI_NUDGE = 200, UV_NUDGE = 8, SOON_MIN = 60, CD_ALERT_DAYS = 3, CD_MAX_DAYS = 60;
  const INTER_EVERY = 10 * 60e3, INTER_FOR = 30e3, CONFETTI_FOR = 90e3;
  const DATA_EVERY = 5 * 60e3, WX_EVERY = 15 * 60e3, PHOTO_EVERY = 60e3, RELOAD_EVERY = 6 * 3600e3;
  const GOLD = '#F2B84F';
  const BUILD = 'desk-v2-20261109-wifework';   // bump on every release: tablets reload themselves when this changes

  // ---------- Config from URL, remembered on device ----------
  const qs = new URLSearchParams(location.search);
  let cfg = {};
  try { cfg = JSON.parse(localStorage.getItem('dash-config') || '{}'); } catch (e) {}
  ['api', 'key', 'lat', 'lon', 'light'].forEach(k => { if (qs.get(k)) cfg[k] = qs.get(k); });
  if (qs.get('reset')) cfg = {};
  try { localStorage.setItem('dash-config', JSON.stringify(cfg)); } catch (e) {}
  const LAT = parseFloat(cfg.lat) || LAT_DEFAULT, LON = parseFloat(cfg.lon) || LON_DEFAULT;
  const DEMO = qs.get('demo') === '1' || !cfg.api || !cfg.key;
  const LIGHT_AUTO = cfg.light === '1';
  // ?wx=clear|cloudy|drizzle|rain|storm|fog|haze previews a weather state (never cached)
  const WXP = {
    clear: { code: 0, cc: 5, rain: 0, tRain: 10, aqi: 42 }, cloudy: { code: 3, cc: 92, rain: 20, aqi: 60 },
    drizzle: { code: 53, cc: 85, rain: 50 }, rain: { code: 63, cc: 96, rain: 85, tRain: 60, tCode: 63, aqi: 45 },
    storm: { code: 95, cc: 100, rain: 95, tRain: 70, tCode: 80 }, fog: { code: 45, cc: 100, rain: 5, aqi: 90 }, haze: { code: 1, cc: 25, rain: 0, aqi: 260 },
  };
  const WXO = (WXP[qs.get('wx')] || qs.get('aqi')) ? { ...(WXP[qs.get('wx')] || {}), ...(qs.get('aqi') ? { aqi: +qs.get('aqi') } : {}) } : null;   // ?aqi=NN previews an AQI
  const FX_ON = qs.get('fx') !== '0';
  // ?at=19:13 previews that time of day (sky, timeline, arc, hero) without waiting for it
  const AT = /^(\d{1,2}):(\d{2})$/.exec(qs.get('at') || '');
  const clockNow = () => { const d = new Date(); if (AT) d.setHours(+AT[1], +AT[2], 0, 0); return d; };

  // ---------- Helpers ----------
  const $ = s => document.querySelector(s);
  const set = (s, html) => { const el = $(s); if (el && el.innerHTML !== html) el.innerHTML = html; };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const hm = d => `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
  const ampm = d => `${hm(d)} ${d.getHours() < 12 ? 'am' : 'pm'}`;
  const hoursOf = d => d.getHours() + d.getMinutes() / 60;
  const fmtH = h => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); const d = new Date(2000, 0, 1, mm === 60 ? hh + 1 : hh, mm === 60 ? 0 : mm); return ampm(d); };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

  // ---------- Priority markers: "!!" = P1, "!" = P2, no marker = P3 (marker at the start or end of a title) ----------
  const prioOf = s => { const t = String(s || '').trim(); if (/^!!|!!$/.test(t)) return 1; if (/^!|!$/.test(t)) return 2; return 3; };
  const stripPrio = s => String(s || '').trim().replace(/^!{1,2}\s*/, '').replace(/\s*!{1,2}$/, '').trim();
  // how far ahead each level shows: P1 30 days, P2 10 days, P3 5 days
  const CD_WINDOW = { 1: 30, 2: 10, 3: 5 };
  const cdShow = c => c.days >= 0 && c.days <= (CD_WINDOW[c.pri ?? 3] ?? 5);
  function normalize(d) {
    if (!d) return d;
    const ev = e => ({ ...e, pri: prioOf(e.title), title: stripPrio(e.title) });
    return {
      ...d,
      today: (d.today || []).map(ev),
      tomorrow: (d.tomorrow || []).map(ev),
      countdowns: (d.countdowns || []).map(c => ({ ...c, pri: prioOf(c.label), label: stripPrio(c.label) })),
    };
  }
  const PALETTE = ['#9CC4FF', '#A6E0C6', '#D7B4F0', '#F5A08F', '#E8D36B', '#8FD0E0'];
  function personStyle(who, fallback) {
    const w = String(who || '').trim();
    if (!w) return null;
    if (/^me$/i.test(w)) return { label: 'Me', color: '#F2B47A', name: 'Me' };
    if (/^(all|family)$/i.test(w)) return { label: 'All', color: '#E8E2D6', name: 'Everyone' };
    if (/^kids$/i.test(w)) return { label: 'K', color: fallback || '#9CC4FF', name: 'Kids' };
    let h = 0; for (const ch of w.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return { label: w[0].toUpperCase(), color: PALETTE[h % PALETTE.length], name: w };
  }
  const personColor = (who, fb) => (personStyle(who, fb) || {}).color || fb || '#E8E2D6';
  function splitWho(label) {
    const m = /^\s*([^·]{1,14}?)\s*·\s+(.+)$/.exec(String(label || ''));
    return m ? { who: m[1].trim(), title: m[2].trim() } : { who: '', title: String(label || '') };
  }

  const ICONS = {
    drop: '<path d="M12 3.5c3.2 4 5.5 6.9 5.5 10a5.5 5.5 0 0 1-11 0c0-3.1 2.3-6 5.5-10z"/>',
    bell: '<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 21h4"/>',
    leaf: '<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14z"/><path d="M5 19c3-4 6-7 10-9"/>',
    dumbbell: '<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
    uv: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7"/>',
  };
  const svgIc = (name, size, color) => `<svg class="ic" aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" stroke="${color}" style="flex-shrink:0">${ICONS[name]}</svg>`;

  // emoji for event types: first match wins, no match = person-coloured dot
  const EMOJI_MAP = [
    [/\b(blood|doctor|dentist|clinic|hospital|vaccin)/i, '🩺'],
    [/\b(birthday|bday)/i, '🎂'],
    [/\b(diwali|deepavali)/i, '🪔'],
    [/\bholi\b/i, '🎨'],
    [/\bchristmas/i, '🎄'],
    [/\b(sankranti|pongal)/i, '🪁'],
    [/\b(exam(?!ple)|test|nse|olympiad|quiz|jee)/i, '📝'],
    [/\b(tuition|class|lesson)/i, '📚'],
    [/\b(school|pta)|parent[- ]teacher|\bbus\b/i, '🎒'],
    [/\b(piano|music|dance)/i, '🎵'],
    [/\b(dinner|lunch|breakfast|brunch)/i, '🍽️'],
    [/\b(movie|film)/i, '🎬'],
    [/\b(flight|trip|travel|airport)/i, '✈️'],
    [/\b(sabbatical|vacation|leave|holiday)/i, '🌴'],
    [/\b(meeting|review|call)/i, '💼'],
    [/\b(pay(ment)?|bills?|billing|fees?)\b/i, '💳'],
    [/\bpack/i, '🧳'],
    [/\b(gym|workout)/i, '🏋️'],
    [/\b(buy|shop)/i, '🛒'],
  ];
  const emojiFor = t => { const s = String(t || ''); for (const [re, e] of EMOJI_MAP) if (re.test(s)) return e; return ''; };
  const wxEmoji = (code, day = 1) => code == null ? '⛅' : code <= 1 ? (day ? '☀️' : '🌙') : code <= 3 ? '⛅' : (code === 45 || code === 48) ? '🌫️' :
    ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) ? '🌧️' : code >= 95 ? '⛈️' : '⛅';
  const fmtT = d => { const h = d.getHours() % 12 || 12, m = d.getMinutes(); return `${h}${m ? ':' + String(m).padStart(2, '0') : ''} ${d.getHours() < 12 ? 'am' : 'pm'}`; };
  const cut = (s, n = 4) => String(s).trim().split(/\s+/).slice(0, n).join(' ');
  const dayAbbr = d => DAYS[d.getDay()].slice(0, 3);
  const ALL3 = ['#F2B47A', '#9CC4FF', '#A6E0C6'];
  function dotsHtml(who, fb, size = 22) {
    const p = personStyle(who, fb); if (!p) return '';
    const cols = p.name === 'Everyone' ? ALL3 : [p.color];
    return `<span class="dots">${cols.map(c => `<i style="width:${size}px;height:${size}px;background:linear-gradient(${c},${c})"></i>`).join('')}</span>`;
  }
  // headline: one person dot only (Everyone shows a single neutral dot, not three)
  function oneDot(who, fb, size = 22) {
    const p = personStyle(who, fb); if (!p) return '';
    const c = p.name === 'Everyone' ? ALL3[0] : p.color;
    return `<span class="dots"><i style="width:${size}px;height:${size}px;background:linear-gradient(${c},${c})"></i></span>`;
  }

  // Indian AQI (CPCB) from 24-h average PM2.5 / PM10
  const BP = {
    pm25: [[0, 30, 0, 50], [31, 60, 51, 100], [61, 90, 101, 200], [91, 120, 201, 300], [121, 250, 301, 400], [251, 500, 401, 500]],
    pm10: [[0, 50, 0, 50], [51, 100, 51, 100], [101, 250, 101, 200], [251, 350, 201, 300], [351, 430, 301, 400], [431, 600, 401, 500]],
  };
  function subIndex(c, table) {
    if (c == null || isNaN(c)) return null;
    const x = Math.round(c);
    for (const [lo, hi, ilo, ihi] of table) if (x <= hi) return Math.round(ilo + (ihi - ilo) * (Math.max(x, lo) - lo) / (hi - lo));
    return 500;
  }
  const aqiColor = a => a <= 50 ? '#8FD3B6' : a <= 100 ? '#C5DB7A' : a <= 200 ? '#E8D36B' : a <= 300 ? '#F2A65A' : a <= 400 ? '#F28C7A' : '#E86A6A';
  const uvCat = u => u < 3 ? ['low', '#8FD3B6'] : u < 6 ? ['moderate', '#E8D36B'] : u < 8 ? ['high', '#F2A65A'] : u < 11 ? ['very high', '#F28C7A'] : ['extreme', '#D7B4F0'];

  // ---------- State ----------
  let data = null, wx = null, lastOk = 0;
  try { wx = JSON.parse(localStorage.getItem('dash-wx') || 'null'); } catch (e) {}
  let photos = [], photoKey = '', photoIdx = 0, photoLayer = 0;
  let interActive = false, lastInter = Date.now(), interTimer = null, confettiTimer = null, lastHero = null;

  // ---------- Sample data ----------
  function sample() {
    const base = new Date(); base.setHours(0, 0, 0, 0);
    const ev = (title, h, m, mins, who, color, off = 0) => {
      const s = base.getTime() + off * 864e5 + (h * 60 + m) * 60e3;
      return { title, allDay: false, start: s, end: s + mins * 60e3, time: hm(new Date(s)), who, color };
    };
    const allDay = (title, who, color, off = 0) => ({ title, allDay: true, start: base.getTime() + off * 864e5, end: base.getTime() + (off + 1) * 864e5, time: 'All day', who, color });
    const today = [ev('School bus', 8, 0, 30, 'Rhea', '#7FB3FF'), ev('Client review', 10, 30, 60, 'Me', '#F2A65A'), ev('Tuition', 12, 0, 60, 'Lucky', '#7FB3FF'), ev('Piano', 16, 30, 60, 'Rhea', '#7FB3FF'), ev('Diwali dinner', 19, 30, 90, 'All', '#E8E2D6')];
    if (qs.get('bday')) today.unshift({ title: "Riya's birthday · turns 12", allDay: true, start: base.getTime(), end: base.getTime() + 864e5, time: 'All day', who: 'All', color: '#E8E2D6' });
    return {
      today,
      tomorrow: [allDay('Diwali', 'All', '#E8E2D6', 1), ev('Weekly test', 7, 0, 60, 'Rhea', '#7FB3FF', 1)],
      tasks: { today: [], tomorrow: ['Gas cylinder booking'], soon: ['Mon · Parent-teacher meeting'], open: [] },
      todos: ['!! Pay internet bill'], shopping: ['Curd', 'Bananas'],
      countdowns: [{ label: 'Diwali', days: 1 }, { label: '! Rhea · NSEC', days: 15 }, { label: 'Lucky · NSEJS', days: 15 }],
      message: 'Proud of you, champ!', pack: 'Hall ticket', meals: { today: { breakfast: 'Idli', lunch: 'Lemon rice', dinner: 'Dal, rice, beans fry', prep: 'Soak rajma tonight' }, tomorrow: null }, photos: qs.get('photos') ? [{ id: 'demo-a', w: 1200, h: 1600, t: '2017-02' }, { id: 'demo-b', w: 1600, h: 1200, t: '2019-11-08' }, { id: 'demo-c', w: 1200, h: 1600, t: '2021-05' }, { id: 'demo-d', w: 1600, h: 1200, t: '2023-08' }] : [], workout: { title: 'Hack Squat + Chest/Back' },
      presence: qs.get('fam') ? [{ who: 'Rakesh', place: 'Office', event: 'arrive', at: base.getTime() + 9.4 * 3600e3 }, { who: 'Sujatha', place: 'Home', event: 'arrive', at: base.getTime() + 8 * 3600e3 }, { who: 'Rhea', place: 'FIITJEE', event: 'arrive', at: base.getTime() + 10 * 3600e3 }, { who: 'Lakshita', place: 'School', event: 'leave', at: Date.now() - 20 * 60e3 }] : [],
    };
  }

  // ---------- Loading ----------
  async function loadData() {
    if (DEMO) { data = normalize(sample()); lastOk = Date.now(); render(); return; }
    try {
      const r = await fetch(`${cfg.api}?key=${encodeURIComponent(cfg.key)}`, { cache: 'no-store' });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      data = normalize(j); lastOk = Date.now();
      try { localStorage.setItem('dash-data', JSON.stringify({ t: lastOk, j })); } catch (e) {}
    } catch (e) {
      if (!data) { try { const c = JSON.parse(localStorage.getItem('dash-data')); if (c) { data = normalize(c.j); lastOk = c.t; } } catch (e2) {} }
      console.warn('Data load failed', e);
    }
    render();
  }

  async function loadWeather() {
    const next = { ...(wx || {}) };
    try {
      const f = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
        `&current=temperature_2m,weather_code,is_day,uv_index,cloud_cover` +
        `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,uv_index_max,sunrise,sunset` +
        `&timezone=Asia%2FKolkata&forecast_days=2`, { cache: 'no-store' }).then(r => r.json());
      const tOf = s => { const m = /T(\d{2}):(\d{2})/.exec(s || ''); return m ? +m[1] + m[2] / 60 : null; };
      Object.assign(next, {
        temp: Math.round(f.current.temperature_2m), code: f.current.weather_code, day: f.current.is_day, uv: f.current.uv_index, cc: f.current.cloud_cover,
        hi: Math.round(f.daily.temperature_2m_max[0]), lo: Math.round(f.daily.temperature_2m_min[0]),
        rain: f.daily.precipitation_probability_max[0] ?? 0, dCode: f.daily.weather_code[0], uvMax: f.daily.uv_index_max[0],
        tHi: Math.round(f.daily.temperature_2m_max[1]), tLo: Math.round(f.daily.temperature_2m_min[1]),
        tRain: f.daily.precipitation_probability_max[1] ?? 0, tCode: f.daily.weather_code[1],
        sr: tOf(f.daily.sunrise[0]), ss: tOf(f.daily.sunset[0]), sr2: tOf(f.daily.sunrise[1]),
        at: Date.now(),
      });
    } catch (e) { console.warn('Weather failed', e); }
    try {
      const a = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}` +
        `&hourly=pm2_5,pm10&past_days=1&forecast_days=1&timezone=Asia%2FKolkata`, { cache: 'no-store' }).then(r => r.json());
      const now = new Date();
      const nowKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}T${String(now.getHours()).padStart(2, '0')}:00`;
      const idx = a.hourly.time.map((t, i) => [t, i]).filter(([t]) => t <= nowKey).slice(-24).map(([, i]) => i);
      const avg = arr => { const v = idx.map(i => arr[i]).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
      const vals = [subIndex(avg(a.hourly.pm2_5), BP.pm25), subIndex(avg(a.hourly.pm10), BP.pm10)].filter(x => x != null);
      next.aqi = vals.length ? Math.max(...vals) : null;
    } catch (e) { console.warn('AQI failed', e); }
    if (next.at) { wx = next; if (!WXO) { try { localStorage.setItem('dash-wx', JSON.stringify(next)); } catch (e) {} } }
    render();
  }

  // ---------- Sun times and the sky ----------
  const SR = () => (wx && wx.sr != null) ? wx.sr : 6.13;
  const SS = () => (wx && wx.ss != null) ? wx.ss : 17.7;
  const SR2 = () => (wx && wx.sr2 != null) ? wx.sr2 : SR();
  const SKY = {
    night:  ['#090B14', '#0F1320', '#161A27'],
    dawn:   ['#1A1B38', '#3F2E57', '#8D4C4B'],
    morn:   ['#1D2B40', '#2E4259', '#5C6F7C'],
    day:    ['#1B2A3D', '#25394F', '#33506A'],
    golden: ['#1F2740', '#4B3555', '#B05A40'],
    dusk:   ['#12142F', '#2A1D4B', '#6A3358'],
    deep:   ['#0E1128', '#241A44', '#7C3A4F'],
  };
  const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => '#' + rgb(a).map((v, i) => Math.round(v + (rgb(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
  function skyAt(h, T = SKY) {
    const sr = SR(), ss = SS();
    const A = [[sr - 1, 'night'], [sr - .3, 'dawn'], [sr + 1, 'morn'], [sr + 2.5, 'day'], [ss - 2, 'day'], [ss - .25, 'golden'], [ss + .5, 'dusk'], [ss + 1.5, 'deep'], [ss + 3, 'night']];
    if (h <= A[0][0] || h >= A[A.length - 1][0]) return T.night;
    for (let i = 0; i < A.length - 1; i++) {
      if (h >= A[i][0] && h <= A[i + 1][0]) {
        const t = (h - A[i][0]) / (A[i + 1][0] - A[i][0]), p = T[A[i][1]], q = T[A[i + 1][1]];
        return [mix(p[0], q[0], t), mix(p[1], q[1], t), mix(p[2], q[2], t)];
      }
    }
    return T.night;
  }
  function renderSky() {
    const [t, m, b] = skyAt(hoursOf(clockNow()));
    const css = `linear-gradient(180deg,${t} 0%,${m} 50%,${b} 100%)`, el = $('#sky');
    if (el.dataset.c !== css) { el.style.background = css; el.dataset.c = css; }
  }

  // ---------- Hero ----------
  function birthdayToday() {
    for (const e of (data?.today || [])) {
      const m = /^(.+?)['’]s birthday(?:.*?turns\s+(\d+))?/i.exec(e.title || '');
      if (m) return { name: m[1].trim(), age: m[2] ? +m[2] : 0 };
    }
    return null;
  }
  function heroPick(nowMs) {
    const today = (data?.today || []).filter(e => !e.allDay);
    const live = today.find(e => e.start <= nowMs && e.end > nowMs);
    const nxt = today.find(e => e.start > nowMs);
    const bd = birthdayToday();
    if (bd && !live && !(nxt && nxt.start - nowMs <= 30 * 60e3)) return { birthday: bd };
    if (live) return { e: live, state: 'now' };
    if (nxt) { const mins = Math.round((nxt.start - nowMs) / 60e3); return { e: nxt, state: mins <= SOON_MIN ? 'soon' : 'next', mins }; }
    const tmr = (data?.tomorrow || []).find(e => !e.allDay);
    if (tmr) return { e: tmr, state: 'tomorrow' };
    const cands = (data?.countdowns || []).filter(cdShow).sort((a, b) => ((a.pri ?? 3) - (b.pri ?? 3)) || (a.days - b.days));
    const cd = cands[0];
    if (cd) {
      const same = cd.pri === 1 ? cands.filter(c => c.pri === 1 && c.days === cd.days) : [cd];   // two P1s on the same date share the hero: "A / B"
      const p = splitWho(cd.label);
      return { state: 'cd', days: cd.days, e: { title: same.map(c => splitWho(c.label).title).join(' / '), who: p.who }, meta: cd.days === 0 ? 'Today' : cd.days === 1 ? 'Tomorrow' : `In ${cd.days} days` };
    }
    return { e: { title: data?.message || 'A quiet day' }, state: 'idle' };
  }
  // the headline is a fixed 10u serif with ellipsis; no shrink-to-fit
  function fitTitle() { const el = document.querySelector('.js-hero .htitle'); if (el) el.style.fontSize = ''; }
  function heroHtml(o) {
    const tile = `<div class="tile" style="background:${hexA(o.color, .22)}">${o.emoji ? `<span class="te">${o.emoji}</span>` : `<i class="td" style="background:linear-gradient(${o.color},${o.color})"></i>`}</div>`;
    return `${tile}<div class="ht"><div class="htitle">${esc(o.title)}</div><div class="hmeta">${o.meta || ''}</div></div>`;
  }
  function renderHero(nowMs) {

    let shown = {}; try { shown = JSON.parse(localStorage.getItem('dash-inter') || '{}'); } catch (e) {}
    if (shown.day !== key) shown = { day: key, ids: [] };
    const hit = photos.find(p => { const d = parseDate(p.t); return d && d.d === n.getDate() && d.mo === n.getMonth() + 1 && d.y < n.getFullYear() && !shown.ids.includes(p.id); });
    const p = hit || photos[photoIdx % photos.length];
    if (hit) { shown.ids.push(hit.id); try { localStorage.setItem('dash-inter', JSON.stringify(shown)); } catch (e) {} }
    return p;
  }
  function interCaption(p) {
    const d = parseDate(p.t); if (!d) return { sub: '', title: '' };
    const n = clockNow(), months = (n.getFullYear() - d.y) * 12 + (n.getMonth() + 1 - d.mo), yrs = Math.floor(months / 12);
    const onDay = d.d && d.mo === n.getMonth() + 1 && d.d === n.getDate() && d.y < n.getFullYear();
    const ago = yrs >= 2 ? `${yrs} years ago` : yrs === 1 ? 'A year ago' : months >= 1 ? `${plural(months, 'month')} ago` : 'This month';
    return { sub: onDay ? `On this day, ${yrs === 1 ? 'a year' : yrs + ' years'} ago` : ago, title: d.d ? `${d.d} ${MONTHS[d.mo - 1]} ${d.y}` : `${MONTHS[d.mo - 1]} ${d.y}` };
  }
  function startInterlude() {
    if (interActive || !photos.length) return;
    const p = pickInterludePhoto(); if (!p) return;
    const url = thumb(p.id, 2000), tiny = thumb(p.id, 64), img = new Image();
    img.onload = () => {
      if (interActive) return;
      interActive = true; $('#stage').classList.add('hush');
      const w = p.w || img.naturalWidth, h = p.h || img.naturalHeight, land = w > h * 1.1, cap = interCaption(p);
      set('.js-inter-imgs', `<div class="ibg" style="background-image:url('${tiny}')"></div><div class="ifg ${land ? 'land' : 'port'}" style="background-image:url('${url}')"></div>`);
      set('.js-i-sub', esc(cap.sub)); set('.js-i-title', esc(cap.title));
      set('.js-i-bar', '<i></i>');
      const nowD = clockNow(), nxt = (data?.today || []).filter(e => !e.allDay && e.start > nowD.getTime())[0];
      if (nxt) { const mins = Math.round((nxt.start - nowD.getTime()) / 60e3); set('.js-i-next', `<span>Next, ${esc(nxt.title)} ${mins <= 90 ? 'in ' + plural(mins, 'minute') : 'at ' + ampm(new Date(nxt.start))}</span>${dotsHtml(nxt.who, nxt.color, 30)}`); } else set('.js-i-next', '');
      if (wx) set('.js-i-wx', `<span style="font-size:40px;line-height:1">${wxEmoji(wx.code, wx.day)}</span><span class="tn" style="font-family:var(--serif);font-size:52px;line-height:1">${wx.temp}°</span>`);
      $('#inter').classList.add('on');
      clearTimeout(interTimer); interTimer = setTimeout(endInterlude, INTER_FOR);
    };
    img.onerror = () => { lastInter = Date.now(); };
    img.src = url;
  }
  function endInterlude() {
    clearTimeout(interTimer); $('#inter').classList.remove('on');
    setTimeout(() => { interActive = false; $('#stage').classList.remove('hush'); lastInter = Date.now(); nextPhoto(); }, 1000);
  }
  function maybeInterlude() {
    return;   // full-page photo interlude removed
    if (Date.now() - lastInter >= INTER_EVERY) startInterlude();
  }
  $('#inter').addEventListener('click', endInterlude);
  window.__startInterlude = startInterlude;   // for previewing: open the console and call it

  // ---------- Event moment: confetti once, on a birthday ----------
  function maybeCelebrate() {
    if (!data || document.hidden || isNight() || clockNow().getHours() < 6) return;
    const bd = birthdayToday(); if (!bd) return;
    const k = 'dash-bday', today = clockNow().toDateString();
    let done = ''; try { done = localStorage.getItem(k) || ''; } catch (e) {}
    if (done === today + bd.name && !qs.get('bday')) return;
    if ($('#confetti').childElementCount) return;
    try { localStorage.setItem(k, today + bd.name); } catch (e) {}
    const cols = ['#F2A65A', '#F0B14A', '#D7B4F0', '#9CC4FF', '#A6E0C6', '#F28C7A', '#F3ECDF'];
    let h = '';
    for (let i = 0; i < 46; i++) h += `<i style="left:${(Math.random() * 98 + 1).toFixed(1)}%;width:${8 + Math.random() * 5 | 0}px;height:${14 + Math.random() * 8 | 0}px;border-radius:${[2, 2, 7][i % 3]}px;background:${cols[i % cols.length]};animation-duration:${(5 + Math.random() * 4).toFixed(1)}s;animation-delay:${(-Math.random() * 9).toFixed(1)}s"></i>`;
    $('#confetti').innerHTML = h;
    clearTimeout(confettiTimer); confettiTimer = setTimeout(() => { $('#confetti').innerHTML = ''; }, CONFETTI_FOR);
  }

  // ---------- Self-update: pick up new releases without anyone touching the tablet ----------
  let lastCheck = Date.now();
  async function checkForUpdate() {
    lastCheck = Date.now();
    try {
      const t = await fetch(location.pathname + '?chk=' + Date.now(), { cache: 'no-store' }).then(r => r.text());
      const m = /const BUILD = '([^']+)'/.exec(t);
      if (m && m[1] !== BUILD) location.reload();
    } catch (e) {}
  }
  window.__checkUpdate = checkForUpdate;

  // ---------- Layout ----------
  const DESIGN_H = 860, MIN_W = 1100;
  let fitScale = 1, fitMode = 'window';
  function viewBox() {
    const vv = window.visualViewport;
    if (vv && vv.width > 0 && vv.height > 0 && (vv.width < innerWidth * 0.98 || vv.height < innerHeight * 0.98)) { fitMode = 'visual'; return { W: vv.width, H: vv.height, x: vv.pageLeft || 0, y: vv.pageTop || 0 }; }
    fitMode = 'window'; return { W: innerWidth, H: innerHeight, x: 0, y: 0 };
  }
  function fit() {
    const { W, H, x, y } = viewBox();
    let s = H / DESIGN_H, w = W / s, h = DESIGN_H;
    if (w < MIN_W) { s = W / MIN_W; w = MIN_W; h = H / s; }
    const st = $('#stage');
    st.style.left = x + 'px'; st.style.top = y + 'px'; st.style.width = w + 'px'; st.style.height = h + 'px'; st.style.transform = `scale(${s})`;
    st.style.setProperty('--u', (h / 100).toFixed(3) + 'px');   // 1u = 1% of the stage height
    fitScale = s;
    if (data) { renderRibbon(clockNow()); renderScene(clockNow(), isNight()); fitTitle(); }
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
  $('.js-photo').addEventListener('click', () => nextPhoto());   // tap the photo to skip

  // ---------- Fully Kiosk integration (all no-ops in a normal browser) ----------
  let lastLevel = null;
  function setLevel(level) { if (!F || level === lastLevel) return; try { F.setScreenBrightness(level); lastLevel = level; } catch (e) {} }
  function lightLevel() {
    try { const lux = parseFloat(F.getSensorValue(5)); if (!isFinite(lux) || lux < 0) return null; return Math.round(20 + 235 * Math.pow(Math.min(1, Math.log10(lux + 1) / 3), 1.6)); } catch (e) { return null; }
  }
  function applyBrightness() {
    if (!F) return;
    const l = LIGHT_AUTO ? lightLevel() : null;
    if (l != null) setLevel(isNight() ? Math.min(l, NIGHT_CAP) : l); else setLevel(isNight() ? NIGHT_LEVEL : DAY_LEVEL);
  }
  window.__fridgeRefresh = function () {
    try {
      if (Date.now() - lastOk > 60e3) loadData();
      if (!wx || Date.now() - (wx.at || 0) > 5 * 60e3) loadWeather();
      applyBrightness(); tick(); render(); maybeCelebrate();
      if (Date.now() - lastCheck > 5 * 60e3) checkForUpdate();
    } catch (e) {}
  };
  if (F) {
    ['screenOn', 'onMotion', 'internetReconnect', 'networkReconnect'].forEach(ev => { try { F.bind(ev, '__fridgeRefresh();'); } catch (e) {} });
    try { F.bind('pluggedAC', 'renderStatusNow();'); F.bind('unplugged', 'renderStatusNow();'); } catch (e) {}
    window.renderStatusNow = renderStatus;
  }
  document.addEventListener('contextmenu', e => e.preventDefault());

  if (qs.get('debug')) {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;left:48px;top:520px;z-index:9;font:13px/1.45 monospace;color:#C9C0B3;background:rgba(0,0,0,.78);padding:8px 12px;border-radius:8px;white-space:pre';
    $('#stage').appendChild(d);
    const g = (fn, dflt = '?') => { try { return fn(); } catch (e) { return dflt; } };
    const upd = () => {
      d.textContent = [
        `window ${innerWidth}x${innerHeight} @${devicePixelRatio}x  ratio ${(innerWidth / innerHeight).toFixed(2)}`,
        `visual ${window.visualViewport ? Math.round(visualViewport.width) + 'x' + Math.round(visualViewport.height) + ' zoom ' + visualViewport.scale.toFixed(2) : 'n/a'}   screen ${screen.width}x${screen.height}`,
        `fit by ${fitMode}   stage scale ${fitScale.toFixed(3)}`,
        `scene ${$('.js-sc-body') && $('.js-sc-body').dataset.k}   page clock ${hm(clockNow())}   timezone ${(() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return '?'; } })()}`,
        `fx ${FX_ON ? 'on' : 'off'}   rain level ${rain.lvl} drops ${rain.n} (x${rain.scale.toFixed(2)})   fps ${rain.fps.toFixed(0)}   draw ${rain.ms.toFixed(2)} ms`,
        F ? `fully ${g(() => F.getFullyVersion())} / android ${g(() => F.getAndroidVersion())} / webview ${g(() => F.getWebviewVersion())}` : 'not running in Fully Kiosk',
        F ? `light sensor (lux) ${g(() => F.getSensorValue(5))}   brightness now ${g(() => F.getScreenBrightness())}   applied ${lastLevel}` : '',
        F ? `battery ${g(() => F.getBatteryLevel())}   plugged ${g(() => F.isPlugged())}` : '',
        `weather Kondapur (${LAT}, ${LON})   updated ${wx && wx.at ? hm(new Date(wx.at)) : 'never'}`,
        `build ${BUILD}   sun ${fmtH(SR())} to ${fmtH(SS())}   data age ${lastOk ? Math.round((Date.now() - lastOk) / 1000) + 's' : 'none'}   weather age ${wx && wx.at ? Math.round((Date.now() - wx.at) / 1000) + 's' : 'none'}`,
      ].filter(Boolean).join('\n');
    };
    upd(); setInterval(upd, 4000);
  }

  // ---------- Start ----------
  if (DEMO && qs.get('demo') !== '1') $('.banner').hidden = false;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { try { render(); } catch (e) {} });
  addEventListener('resize', fit); fit();
  tick(); loadData(); loadWeather(); applyBrightness();
  setInterval(tick, 10e3);
  setInterval(applyBrightness, 60e3);
  setInterval(checkForUpdate, 10 * 60e3);
  setInterval(loadData, DATA_EVERY);
  setInterval(loadWeather, WX_EVERY);
  setInterval(nextPhoto, PHOTO_EVERY);
  setTimeout(() => location.reload(), RELOAD_EVERY);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadData(); loadWeather(); tick(); } });
})();
</script>
</body>
</html>
