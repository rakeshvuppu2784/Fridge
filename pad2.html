<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110F">
<title>Fridge (Pad 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --cream: #F3ECDF; --text: #EDE6DA; --dim: #C3CBD6; --faint: #A9B7C7; --gold: #F2B84F; --serif: Fraunces, Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14110F; overflow: hidden; font-family: Inter, system-ui, -apple-system, sans-serif; color: var(--cream);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
  .tn { font-variant-numeric: tabular-nums; }
  #stage { position: absolute; top: 0; left: 0; width: 1204px; height: 860px; transform-origin: 0 0; background: #14110F; overflow: hidden; }
  #sky { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #1B2A3D, #25394F 50%, #33506A); }
  .grid { position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 40px 48px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 40px; }
  .left { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; min-height: 0; }
  .row { display: flex; align-items: center; gap: 12px; font-size: 26px; line-height: 1.2; white-space: nowrap; overflow: hidden; }
  .row .n { overflow: hidden; text-overflow: ellipsis; }
  .row .t { color: var(--dim); min-width: 88px; flex-shrink: 0; }
  .row.act { color: var(--gold); font-weight: 500; }
  .row.dim { color: var(--dim); }
  .lbl { font-size: 24px; color: var(--dim); margin-bottom: 8px; }
  .cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; min-width: 0; }
  .cols > div { min-width: 0; }
  .cds { display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); gap: 4px 36px; min-width: 0; }
  .cd { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; }
  .cd .d { font-family: var(--serif); font-size: 40px; line-height: 1; flex-shrink: 0; }
  .cd .u { font-size: 20px; color: var(--dim); flex-shrink: 0; }
  .cd .names { display: flex; align-items: center; gap: 12px; min-width: 0; overflow: hidden; }
  .cd .nm { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .cd .cdn { font-size: 24px; color: #D5DCE4; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-block; padding: 3px 14px; border-radius: 999px; font-size: 22px; font-weight: 500; white-space: nowrap; }
  svg.ic { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tl { position: relative; height: 146px; }

  .photo { position: relative; border-radius: 30px; overflow: hidden; background: #2A241F; }
  .ph { position: absolute; left: 0; top: 0; right: 0; bottom: 0; opacity: 0; transition: opacity 1.4s ease; }
  .ph.show { opacity: 1; }
  .ph-bg { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-size: cover; background-position: center; filter: brightness(.55); }
  .ph-fg { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-size: cover; background-position: center; background-repeat: no-repeat; }
  .ph.landscape .ph-fg { background-size: contain; background-position: center 30%; }
  .ph-cap { position: absolute; left: 26px; top: 24px; font-size: 22px; color: var(--cream); text-shadow: 0 1px 8px rgba(0,0,0,.55); }
  .ph-dots { position: absolute; right: 26px; top: 30px; display: flex; gap: 5px; }
  .ph-dots span { width: 5px; height: 5px; border-radius: 3px; background: rgba(244,238,228,.45); }
  .ph-dots span.on { width: 16px; background: var(--cream); }
  .ph-empty { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #B5ADA1; text-align: center; padding: 20px; }
  .wx { position: absolute; left: 0; right: 0; bottom: 0; padding: 90px 26px 26px; background: linear-gradient(to top, rgba(14,11,9,.95), rgba(14,11,9,.84) 66%, rgba(14,11,9,0)); }

  #inter { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 6; background: #0C0A09; opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s .9s; }
  #inter.on { opacity: 1; visibility: visible; transition: opacity .9s ease; }
  #inter .imgs, #inter .imgs > div { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  #inter .ibg { background-size: cover; background-position: center; filter: brightness(.5); }
  #inter .ifg { background-position: center; background-repeat: no-repeat; }
  #inter .ifg.land { background-size: cover; animation: pan 34s ease-out forwards; }
  #inter .ifg.port { background-size: contain; }
  #inter .shade-t { position: absolute; left: 0; top: 0; right: 0; height: 200px; background: linear-gradient(to bottom, rgba(10,8,7,.7), rgba(10,8,7,0)); }
  #inter .shade-b { position: absolute; left: 0; bottom: 0; right: 0; height: 360px; background: linear-gradient(to top, rgba(10,8,7,.88), rgba(10,8,7,0)); }
  #inter .ibar { position: absolute; left: 0; bottom: 0; height: 6px; width: 100%; background: rgba(255,255,255,.14); }
  #inter .ibar i { display: block; height: 6px; background: var(--gold); animation: bar 30s linear forwards; }
  @keyframes pan { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.14) translate(-2.5%, -2%); } }
  @keyframes bar { from { width: 0; } to { width: 100%; } }
  @keyframes fall { from { transform: translateY(-40px) rotate(0deg); } to { transform: translateY(940px) rotate(600deg); } }
  @keyframes ring { 0% { transform: scale(.5); opacity: .75; } 100% { transform: scale(2.6); opacity: 0; } }
  @keyframes glow { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
  #confetti { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 7; pointer-events: none; overflow: hidden; }
  #confetti i { position: absolute; top: 0; opacity: .92; animation: fall linear infinite; }

  #dim { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2s; z-index: 8; }
  .status { position: absolute; right: 18px; bottom: 8px; font-size: 14px; color: var(--faint); z-index: 3; }
  .banner { position: absolute; left: 0; right: 0; top: 0; padding: 6px 48px; font-size: 15px; background: #3A2A10; color: #F2C27A; z-index: 9; }
  @media (prefers-reduced-motion: reduce) { .ph { transition: none; } #inter .ifg.land { animation: none; } * { animation-duration: 0s !important; } }
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div class="grid">
    <div class="left">
      <div style="display:flex;align-items:baseline;gap:22px;white-space:nowrap">
        <span class="tn js-clock" style="font-family:var(--serif);font-size:84px;font-weight:400;letter-spacing:-2px;line-height:1"></span>
        <span class="js-date" style="font-size:28px;color:var(--dim)"></span>
      </div>
      <div style="min-width:0">
        <div class="js-hero-eyebrow" style="font-size:26px;line-height:34px;margin-bottom:4px"></div>
        <div class="js-hero-title" style="font-family:var(--serif);font-weight:400;line-height:1.02;letter-spacing:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
        <div class="js-hero-meta" style="display:flex;align-items:center;gap:14px;font-size:30px;color:#D8DEE6;margin-top:12px;min-height:34px"></div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><span style="font-size:24px;color:var(--dim)">Today</span><span class="js-sun" style="font-size:22px;color:var(--faint)"></span></div>
        <div class="tl js-tl"></div>
      </div>
      <div class="cols">
        <div><div class="lbl">Also today</div><div class="js-today"></div></div>
        <div><div class="lbl js-tmr-label">Tomorrow</div><div class="js-tomorrow"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="js-workout" style="display:flex;align-items:center;gap:14px;font-size:26px;white-space:nowrap;overflow:hidden"></div>
        <div class="js-countdowns cds"></div>
      </div>
    </div>
    <div class="photo js-photo">
      <div class="ph js-ph-a"><div class="ph-bg"></div><div class="ph-fg"></div></div>
      <div class="ph js-ph-b"><div class="ph-bg"></div><div class="ph-fg"></div></div>
      <div class="ph-empty js-ph-empty">Add photos to the Drive folder to fill this frame</div>
      <div class="ph-cap js-ph-cap"></div>
      <div class="ph-dots js-ph-dots"></div>
      <div class="wx js-wx"></div>
    </div>
  </div>

  <div id="inter">
    <div class="imgs js-inter-imgs"></div>
    <div class="shade-t"></div><div class="shade-b"></div>
    <div class="tn js-i-clock" style="position:absolute;left:48px;top:36px;font-family:var(--serif);font-size:64px;line-height:1"></div>
    <div class="js-i-wx" style="position:absolute;right:48px;top:40px;display:flex;align-items:center;gap:12px"></div>
    <div style="position:absolute;left:48px;bottom:64px"><div class="js-i-sub" style="font-size:28px;color:#E6DFD2"></div><div class="js-i-title" style="font-family:var(--serif);font-size:72px;line-height:80px;letter-spacing:-1px"></div></div>
    <div class="js-i-next" style="position:absolute;right:48px;bottom:72px;display:flex;align-items:center;gap:14px;font-size:28px;color:#EDE6DA"></div>
    <div class="ibar js-i-bar"></div>
  </div>
  <div id="confetti"></div>
  <div id="dim"></div>
  <div class="status js-status"></div>
  <div class="banner js-banner" hidden>Showing sample data. Open with ?api=YOUR_EXEC_URL&amp;key=YOUR_KEY to connect.</div>
</div>

<script>
(() => {
  // ---------- Settings ----------
  const LAT_DEFAULT = 17.465, LON_DEFAULT = 78.361;     // Kondapur, Hyderabad
  const NIGHT_FROM = 22, NIGHT_TO = 6;                   // dim / pause photo extras between these hours
  const DAY_LEVEL = -1, NIGHT_LEVEL = 25, NIGHT_CAP = 60; // Fully brightness: 0-255, -1 = device default
  const F = (typeof window.fully !== 'undefined') ? window.fully : null;
  const RAIN_NUDGE = 60, HOT_NUDGE = 38, AQI_NUDGE = 200, UV_NUDGE = 8, SOON_MIN = 60, CD_ALERT_DAYS = 3;
  const INTER_EVERY = 10 * 60e3, INTER_FOR = 30e3, CONFETTI_FOR = 90e3;
  const DATA_EVERY = 5 * 60e3, WX_EVERY = 15 * 60e3, PHOTO_EVERY = 60e3, RELOAD_EVERY = 6 * 3600e3;
  const GOLD = '#F2B84F';

  // ---------- Config from URL, remembered on device ----------
  const qs = new URLSearchParams(location.search);
  let cfg = {};
  try { cfg = JSON.parse(localStorage.getItem('dash-config') || '{}'); } catch (e) {}
  ['api', 'key', 'lat', 'lon', 'light'].forEach(k => { if (qs.get(k)) cfg[k] = qs.get(k); });
  if (qs.get('reset')) cfg = {};
  try { localStorage.setItem('dash-config', JSON.stringify(cfg)); } catch (e) {}
  const LAT = parseFloat(cfg.lat) || LAT_DEFAULT, LON = parseFloat(cfg.lon) || LON_DEFAULT;
  const DEMO = qs.get('demo') === '1' || !cfg.api || !cfg.key;
  const LIGHT_AUTO = cfg.light === '1';
  // ?at=19:13 previews that time of day (sky, timeline, arc, hero) without waiting for it
  const AT = /^(\d{1,2}):(\d{2})$/.exec(qs.get('at') || '');
  const clockNow = () => { const d = new Date(); if (AT) d.setHours(+AT[1], +AT[2], 0, 0); return d; };

  // ---------- Helpers ----------
  const $ = s => document.querySelector(s);
  const set = (s, html) => { const el = $(s); if (el && el.innerHTML !== html) el.innerHTML = html; };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const hm = d => `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
  const ampm = d => `${hm(d)} ${d.getHours() < 12 ? 'am' : 'pm'}`;
  const hoursOf = d => d.getHours() + d.getMinutes() / 60;
  const fmtH = h => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); const d = new Date(2000, 0, 1, mm === 60 ? hh + 1 : hh, mm === 60 ? 0 : mm); return ampm(d); };
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

  const PALETTE = ['#9CC4FF', '#A6E0C6', '#D7B4F0', '#F5A08F', '#E8D36B', '#8FD0E0'];
  function personStyle(who, fallback) {
    const w = String(who || '').trim();
    if (!w) return null;
    if (/^me$/i.test(w)) return { label: 'Me', color: '#F2B47A', name: 'Me' };
    if (/^(all|family)$/i.test(w)) return { label: 'All', color: '#E8E2D6', name: 'Everyone' };
    if (/^kids$/i.test(w)) return { label: 'K', color: fallback || '#9CC4FF', name: 'Kids' };
    let h = 0; for (const ch of w.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return { label: w[0].toUpperCase(), color: PALETTE[h % PALETTE.length], name: w };
  }
  function chip(who, fallback, size = 32) {
    const p = personStyle(who, fallback);
    if (!p) return `<span style="display:inline-block;width:${size}px;height:${size}px;border-radius:${size / 2}px;background:rgba(232,226,214,.1);flex-shrink:0"></span>`;
    return `<span style="display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:${size}px;height:${size}px;border-radius:${size / 2}px;background:${hexA(p.color, .22)};color:${p.color};font-size:${Math.round(size * (p.label.length > 1 ? .38 : .44))}px;font-weight:600">${esc(p.label)}</span>`;
  }
  const personColor = (who, fb) => (personStyle(who, fb) || {}).color || fb || '#E8E2D6';
  function splitWho(label) {
    const m = /^\s*([^·]{1,14}?)\s*·\s+(.+)$/.exec(String(label || ''));
    return m ? { who: m[1].trim(), title: m[2].trim() } : { who: '', title: String(label || '') };
  }

  const ICONS = {
    sun: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>',
    moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    cloud: '<path d="M7 18a4.5 4.5 0 1 1 1.2-8.8A5.5 5.5 0 0 1 18.5 11 3.5 3.5 0 0 1 18 18H7z"/>',
    rain: '<path d="M7 15a4.5 4.5 0 1 1 1.2-8.8A5.5 5.5 0 0 1 18.5 8 3.5 3.5 0 0 1 18 15H7z"/><path d="M9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5"/>',
  };
  const iconName = (code, day = 1) => code == null ? 'cloud' : code <= 1 ? (day ? 'sun' : 'moon') : code <= 48 ? 'cloud' : 'rain';
  const svgIcon = (name, size, color, extra = '') => `<svg class="ic" aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" stroke="${color}" style="flex-shrink:0;${extra}">${ICONS[name]}</svg>`;

  // Indian AQI (CPCB) from 24-h average PM2.5 / PM10
  const BP = {
    pm25: [[0, 30, 0, 50], [31, 60, 51, 100], [61, 90, 101, 200], [91, 120, 201, 300], [121, 250, 301, 400], [251, 500, 401, 500]],
    pm10: [[0, 50, 0, 50], [51, 100, 51, 100], [101, 250, 101, 200], [251, 350, 201, 300], [351, 430, 301, 400], [431, 600, 401, 500]],
  };
  function subIndex(c, table) {
    if (c == null || isNaN(c)) return null;
    const x = Math.round(c);
    for (const [lo, hi, ilo, ihi] of table) if (x <= hi) return Math.round(ilo + (ihi - ilo) * (Math.max(x, lo) - lo) / (hi - lo));
    return 500;
  }
  const aqiColor = a => a <= 50 ? '#8FD3B6' : a <= 100 ? '#C5DB7A' : a <= 200 ? '#E8D36B' : a <= 300 ? '#F2A65A' : a <= 400 ? '#F28C7A' : '#E86A6A';
  const uvCat = u => u < 3 ? ['low', '#8FD3B6'] : u < 6 ? ['moderate', '#E8D36B'] : u < 8 ? ['high', '#F2A65A'] : u < 11 ? ['very high', '#F28C7A'] : ['extreme', '#D7B4F0'];

  // ---------- State ----------
  let data = null, wx = null, lastOk = 0;
  try { wx = JSON.parse(localStorage.getItem('dash-wx') || 'null'); } catch (e) {}
  let photos = [], photoKey = '', photoIdx = 0, photoLayer = 0;
  let interActive = false, lastInter = Date.now(), interTimer = null, confettiTimer = null, lastHero = null;

  // ---------- Sample data ----------
  function sample() {
    const base = new Date(); base.setHours(0, 0, 0, 0);
    const ev = (title, h, m, mins, who, color, off = 0) => {
      const s = base.getTime() + off * 864e5 + (h * 60 + m) * 60e3;
      return { title, allDay: false, start: s, end: s + mins * 60e3, time: hm(new Date(s)), who, color };
    };
    const allDay = (title, who, color, off = 0) => ({ title, allDay: true, start: base.getTime() + off * 864e5, end: base.getTime() + (off + 1) * 864e5, time: 'All day', who, color });
    const today = [ev('School bus', 8, 0, 30, 'Rhea', '#7FB3FF'), ev('Client review', 10, 30, 60, 'Me', '#F2A65A'), ev('Tuition', 12, 0, 60, 'Lucky', '#7FB3FF'), ev('Piano', 16, 30, 60, 'Rhea', '#7FB3FF'), ev('Diwali dinner', 19, 30, 90, 'All', '#E8E2D6')];
    if (qs.get('bday')) today.unshift({ title: "Riya's birthday · turns 12", allDay: true, start: base.getTime(), end: base.getTime() + 864e5, time: 'All day', who: 'All', color: '#E8E2D6' });
    return {
      today,
      tomorrow: [allDay('Diwali', 'All', '#E8E2D6', 1), ev('Weekly test', 7, 0, 60, 'Rhea', '#7FB3FF', 1)],
      tasks: { today: [], tomorrow: ['Gas cylinder booking'], soon: ['Mon · Parent-teacher meeting'], open: [] },
      todos: ['Pay internet bill'], shopping: ['Curd', 'Bananas'],
      countdowns: [{ label: 'Diwali', days: 1 }, { label: 'Rhea · NSEC', days: 15 }, { label: 'Lucky · NSEJS', days: 15 }],
      message: 'Proud of you, champ!', pack: 'Hall ticket', photos: [], workout: { title: 'Hack Squat + Chest/Back' },
    };
  }

  // ---------- Loading ----------
  async function loadData() {
    if (DEMO) { data = sample(); lastOk = Date.now(); render(); return; }
    try {
      const r = await fetch(`${cfg.api}?key=${encodeURIComponent(cfg.key)}`, { cache: 'no-store' });
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      data = j; lastOk = Date.now();
      try { localStorage.setItem('dash-data', JSON.stringify({ t: lastOk, j })); } catch (e) {}
    } catch (e) {
      if (!data) { try { const c = JSON.parse(localStorage.getItem('dash-data')); if (c) { data = c.j; lastOk = c.t; } } catch (e2) {} }
      console.warn('Data load failed', e);
    }
    render();
  }

  async function loadWeather() {
    const next = { ...(wx || {}) };
    try {
      const f = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
        `&current=temperature_2m,weather_code,is_day,uv_index` +
        `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,uv_index_max,sunrise,sunset` +
        `&timezone=Asia%2FKolkata&forecast_days=2`, { cache: 'no-store' }).then(r => r.json());
      const tOf = s => { const m = /T(\d{2}):(\d{2})/.exec(s || ''); return m ? +m[1] + m[2] / 60 : null; };
      Object.assign(next, {
        temp: Math.round(f.current.temperature_2m), code: f.current.weather_code, day: f.current.is_day, uv: f.current.uv_index,
        hi: Math.round(f.daily.temperature_2m_max[0]), lo: Math.round(f.daily.temperature_2m_min[0]),
        rain: f.daily.precipitation_probability_max[0] ?? 0, dCode: f.daily.weather_code[0], uvMax: f.daily.uv_index_max[0],
        tHi: Math.round(f.daily.temperature_2m_max[1]), tLo: Math.round(f.daily.temperature_2m_min[1]),
        tRain: f.daily.precipitation_probability_max[1] ?? 0, tCode: f.daily.weather_code[1],
        sr: tOf(f.daily.sunrise[0]), ss: tOf(f.daily.sunset[0]), sr2: tOf(f.daily.sunrise[1]),
        at: Date.now(),
      });
    } catch (e) { console.warn('Weather failed', e); }
    try {
      const a = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}` +
        `&hourly=pm2_5,pm10&past_days=1&forecast_days=1&timezone=Asia%2FKolkata`, { cache: 'no-store' }).then(r => r.json());
      const now = new Date();
      const nowKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}T${String(now.getHours()).padStart(2, '0')}:00`;
      const idx = a.hourly.time.map((t, i) => [t, i]).filter(([t]) => t <= nowKey).slice(-24).map(([, i]) => i);
      const avg = arr => { const v = idx.map(i => arr[i]).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
      const vals = [subIndex(avg(a.hourly.pm2_5), BP.pm25), subIndex(avg(a.hourly.pm10), BP.pm10)].filter(x => x != null);
      next.aqi = vals.length ? Math.max(...vals) : null;

  }

  // ---------- Sun times and the sky ----------
  const SR = () => (wx && wx.sr != null) ? wx.sr : 6.13;
  const SS = () => (wx && wx.ss != null) ? wx.ss : 17.7;
  const SR2 = () => (wx && wx.sr2 != null) ? wx.sr2 : SR();
  const SKY = {
    night:  ['#090B14', '#0F1320', '#161A27'],
    dawn:   ['#1A1B38', '#3F2E57', '#8D4C4B'],
    morn:   ['#1D2B40', '#2E4259', '#5C6F7C'],
    day:    ['#1B2A3D', '#25394F', '#33506A'],
    golden: ['#1F2740', '#4B3555', '#B05A40'],
    dusk:   ['#12142F', '#2A1D4B', '#6A3358'],
    deep:   ['#0E1128', '#241A44', '#7C3A4F'],
  };
  const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => '#' + rgb(a).map((v, i) => Math.round(v + (rgb(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
  function skyAt(h) {
    const sr = SR(), ss = SS();
    const A = [[sr - 1, 'night'], [sr - .3, 'dawn'], [sr + 1, 'morn'], [sr + 2.5, 'day'], [ss - 2, 'day'], [ss - .25, 'golden'], [ss + .5, 'dusk'], [ss + 1.5, 'deep'], [ss + 3, 'night']];

  function renderSky() {

    if (el.dataset.c !== css) { el.style.background = css; el.dataset.c = css; }
  }

  // ---------- Hero ----------
  function birthdayToday() {
    for (const e of (data?.today || [])) {
      const m = /^(.+?)['’]s birthday(?:.*?turns\s+(\d+))?/i.exec(e.title || '');
      if (m) return { name: m[1].trim(), age: m[2] ? +m[2] : 0 };
    }
    return null;
  }
  function heroPick(nowMs) {
    const today = (data?.today || []).filter(e => !e.allDay);
    const live = today.find(e => e.start <= nowMs && e.end > nowMs);
    const nxt = today.find(e => e.start > nowMs);
    const bd = birthdayToday();
    if (bd && !live && !(nxt && nxt.start - nowMs <= 30 * 60e3)) return { birthday: bd };
    if (live) return { e: live, eyebrow: `Now, until ${ampm(new Date(live.end))}`, soon: true };
    if (nxt) {
      const mins = Math.round((nxt.start - nowMs) / 60e3);
      return { e: nxt, eyebrow: mins <= SOON_MIN ? `Next, in ${plural(mins, 'minute')}` : `Next, at ${ampm(new Date(nxt.start))}`, soon: mins <= SOON_MIN };
    }
    const tmr = (data?.tomorrow || []).find(e => !e.allDay);
    if (tmr) return { e: tmr, eyebrow: `Tomorrow, ${ampm(new Date(tmr.start))}`, soon: false };
    const cd = (data?.countdowns || [])[0];
    if (cd) { const p = splitWho(cd.label); return { days: cd.days, e: { title: p.title, who: p.who }, eyebrow: 'Coming up', meta: cd.days === 0 ? 'Today' : cd.days === 1 ? 'Tomorrow' : `In ${cd.days} days`, soon: false }; }
    return { e: { title: data?.message || 'A quiet day' }, eyebrow: 'Today', soon: false };
  }
  const titleSize = len => Math.max(46, Math.min(88, Math.floor(620 / (Math.max(len, 1) * .52))));

  function renderHero(nowMs) {
    const h = heroPick(nowMs), eb = $('.js-hero-eyebrow'), tt = $('.js-hero-title');
    if (h.birthday) {
      const title = `Happy birthday, ${h.birthday.name}`;
      set('.js-hero-eyebrow', 'Today'); eb.style.color = GOLD;
      set('.js-hero-title', esc(title)); tt.style.fontSize = titleSize(title.length) + 'px';
      set('.js-hero-meta', h.birthday.age ? `Turns ${h.birthday.age}` : '');
      return h;
    }
    set('.js-hero-eyebrow', esc(h.eyebrow)); eb.style.color = h.soon ? GOLD : 'var(--dim)';

    if (h.meta) parts.push(esc(h.meta));

    set('.js-hero-meta', parts.join(''));
    return h;
  }

  // ---------- Timeline ----------
  function renderTimeline(nowD) {
    const host = $('.js-tl'); if (!host || !data) return;
    const W = host.clientWidth || 648, nowH = hoursOf(nowD);
    const day0 = new Date(nowD.getFullYear(), nowD.getMonth(), nowD.getDate()).getTime();
    const evs = (data.today || []).filter(e => !e.allDay && e.end > e.start)
      .map(e => ({ s: Math.max(0, (e.start - day0) / 3600e3), e: Math.min(24, (e.end - day0) / 3600e3), title: e.title, who: e.who, color: e.color }))
      .sort((a, b) => a.s - b.s);
    let lo = 6, hi = 22;
    evs.forEach(x => { lo = Math.min(lo, Math.floor(x.s)); hi = Math.max(hi, Math.ceil(x.e)); });
    lo = Math.max(0, Math.floor(lo / 3) * 3); hi = Math.min(24, hi);
    const X = h => (h - lo) / (hi - lo) * W, sr = SR(), ss = SS();
    const a = Math.min(100, Math.max(0, X(sr) / W * 100)), b = Math.min(100, Math.max(0, X(ss) / W * 100));
    let o = `<div style="position:absolute;left:0;top:0;width:${W}px;height:40px;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.07) 0,rgba(255,255,255,.07) ${a}%,rgba(242,184,79,.20) ${a}%,rgba(242,184,79,.20) ${b}%,rgba(255,255,255,.07) ${b}%)"></div>`;
    const lanes = [[], []];
    evs.forEach(x => {
      const past = x.e <= nowH, c = personColor(x.who, x.color), xc = X((x.s + x.e) / 2);
      o += `<div style="position:absolute;left:${X(x.s).toFixed(1)}px;top:6px;width:${Math.max((X(x.e) - X(x.s)) - 3, 14).toFixed(1)}px;height:28px;border-radius:9px;background:${c};opacity:${past ? .35 : 1}"></div>`;
      const w = Math.min(160, String(x.title).length * 11.8), l = Math.max(0, xc - w / 2), r = Math.min(W, xc + w / 2);
      for (let k = 0; k < 2; k++) {
        if (lanes[k].every(q => r + 8 < q[0] || l - 8 > q[1])) {
          lanes[k].push([l, r]);
          o += `<div style="position:absolute;left:${((l + r) / 2).toFixed(1)}px;top:${50 + k * 28}px;transform:translateX(-50%);font-size:22px;white-space:nowrap;color:${past ? 'rgba(237,230,218,.5)' : 'var(--text)'}">${esc(x.title)}</div>`;
          break;
        }
      }
    });
    if (!evs.length) o += `<div style="position:absolute;left:0;top:52px;font-size:22px;color:var(--faint)">Nothing scheduled</div>`;

      const pos = h === lo ? 'left:0' : (X(h) > W - 36 ? 'right:0' : `left:${X(h).toFixed(1)}px;transform:translateX(-50%)`);
      o += `<div style="position:absolute;${pos};top:116px;font-size:20px;color:var(--faint);white-space:nowrap">${txt}</div>`;
    }
    if (nowH >= lo && nowH <= hi) {
      const nx = X(nowH);
      o += `<div style="position:absolute;left:${(nx - 1).toFixed(1)}px;top:-8px;width:2px;height:52px;background:${GOLD}"></div>`;
      o += `<div style="position:absolute;left:${(nx - 8).toFixed(1)}px;top:13px;width:14px;height:14px;border-radius:7px;border:2px solid ${GOLD};animation:ring 2.8s ease-out infinite"></div>`;
      o += `<div style="position:absolute;left:${(nx - 7).toFixed(1)}px;top:13px;width:14px;height:14px;border-radius:7px;background:${GOLD}"></div>`;

    set('.js-sun', `Sun up ${fmtH(sr)}, down ${fmtH(ss)}`);

  // ---------- Countdown clusters: no near-duplicates, tied dates stay together ----------
  const normLabel = s => splitWho(s).title.toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
  function countdownClusters(list, shown) {
    const items = (list || []).map(c => ({ days: c.days, ...splitWho(c.label), norm: normLabel(c.label) }))
      .filter(a => !(shown || []).some(x => x.days === a.days && a.norm.length >= 3 && (a.norm.includes(x.norm) || x.norm.includes(a.norm))));
    const kept = items.filter((a, i) => a.norm.length < 3 || !items.some((b, j) => j !== i && b.days === a.days && b.norm !== a.norm && b.norm.includes(a.norm)));
    const seen = new Set(), uniq = kept.filter(a => { const k = a.days + '|' + a.norm; if (seen.has(k)) return false; seen.add(k); return true; });
    const groups = [];
    uniq.forEach(a => { let g = groups.find(x => x.days === a.days); if (!g) groups.push(g = { days: a.days, names: [] }); g.names.push(a); });

  }

  // ---------- Lists, workout, countdown ----------
  const trow = (time, who, color, name) => `<div class="row"><span class="t tn">${esc(time)}</span>${chip(who, color, 30)}<span class="n">${esc(name)}</span></div>`;
  const prow = (txt, kind) => `<div class="row ${kind || ''}"><span class="n">${esc(txt)}</span></div>`;

  function renderLists(nowD) {
    if (!data) return;
    const a = [];
    (data.today || []).filter(e => e.allDay).forEach(e => a.push(`<div class="row"><span class="t" style="min-width:0"></span>${chip(e.who, e.color, 30)}<span class="n">${esc(e.title)}</span></div>`.replace('<span class="t" style="min-width:0"></span>', '')));

      const names = g.names.map(n => `<span class="nm"><span class="cdn">${esc(n.title)}</span>${personStyle(n.who) ? chip(n.who, null, 26) : ''}</span>`).join('');

  }

  // ---------- Weather card with sun / moon arc ----------
  function arcSvg(nowH) {
    const sr = SR(), ss = SS(), sr2 = SR2(), P0 = [10, 80], P1 = [184, -36], P2 = [358, 80];
    const qb = t => [0, 1].map(i => (1 - t) ** 2 * P0[i] + 2 * (1 - t) * t * P1[i] + t * t * P2[i]);
    let t, l0, l1, col, glow, core;

    else {
      const start = nowH < sr ? ss - 24 : ss, end = nowH < sr ? sr : sr2 + 24, nn = nowH;

      `<line x1="0" y1="80" x2="368" y2="80" stroke="rgba(255,255,255,.2)" stroke-width="1"/>` +

      `<div style="display:flex;justify-content:space-between;font-size:22px;color:var(--faint);margin-top:2px"><span>${fmtH(l0)}</span><span>${fmtH(l1)}</span></div>`;
  }

      `<div style="display:flex;align-items:center;gap:14px;margin-top:6px">${svgIcon(iconName(wx.code, isDay ? 1 : 0), 54, isDay ? GOLD : '#C9D3E0', 'animation:glow 4s ease-in-out infinite')}` +

  function batteryNote() {

  // ---------- Photo slider ----------
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function syncPhotos(list) {
    const norm = list.map(p => typeof p === 'string' ? { id: p } : p).filter(p => p && p.id);
    const key = norm.map(p => p.id).sort().join();
    if (key === photoKey) return;
    photoKey = key; photos = shuffle(norm); photoIdx = 0;
    $('.js-ph-empty').style.display = photos.length ? 'none' : 'flex';
    if (photos.length) nextPhoto();
  }
  const parseDate = t => { const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?/.exec(t || ''); return m ? { y: +m[1], mo: +m[2], d: m[3] ? +m[3] : 0 } : null; };
  const photoDate = t => { const p = parseDate(t); return p ? `${MONTHS[p.mo - 1]} ${p.y}` : ''; };
  const thumb = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
  function nextPhoto() {
    if (!photos.length || interActive || (isNight() && photoIdx > 0)) return;
    const i = photoIdx++ % photos.length, p = photos[i], url = thumb(p.id, 1600), tiny = thumb(p.id, 64), img = new Image();
    img.onload = () => {
      const a = $('.js-ph-a'), b = $('.js-ph-b'), [show, hide] = photoLayer ? [a, b] : [b, a];
      const w = p.w || img.naturalWidth, h = p.h || img.naturalHeight;
      show.classList.toggle('landscape', w > h * 1.1);
      show.querySelector('.ph-bg').style.backgroundImage = `url("${tiny}")`;
      show.querySelector('.ph-fg').style.backgroundImage = `url("${url}")`;
      show.classList.add('show'); hide.classList.remove('show');
      photoLayer = 1 - photoLayer;
      set('.js-ph-cap', esc(photoDate(p.t)));
      const n = Math.min(photos.length, 5);
      set('.js-ph-dots', n > 1 ? Array.from({ length: n }, (_, k) => `<span class="${k === i % n ? 'on' : ''}"></span>`).join('') : '');
    };
    img.onerror = () => { if (photos.length > 1) setTimeout(nextPhoto, 2000); };
    img.src = url;
  }

  // ---------- Photo interlude: the photo owns the screen for 30 s, every ~10 min ----------
  function pickInterludePhoto() {
    const n = clockNow(), key = `${n.getFullYear()}-${n.getMonth()}-${n.getDate()}`;
    let shown = {}; try { shown = JSON.parse(localStorage.getItem('dash-inter') || '{}'); } catch (e) {}
    if (shown.day !== key) shown = { day: key, ids: [] };
    const hit = photos.find(p => { const d = parseDate(p.t); return d && d.d === n.getDate() && d.mo === n.getMonth() + 1 && d.y < n.getFullYear() && !shown.ids.includes(p.id); });
    const p = hit || photos[photoIdx % photos.length];
    if (hit) { shown.ids.push(hit.id); try { localStorage.setItem('dash-inter', JSON.stringify(shown)); } catch (e) {} }
    return p;
  }
  function interCaption(p) {
    const d = parseDate(p.t); if (!d) return { sub: '', title: '' };
    const n = clockNow(), months = (n.getFullYear() - d.y) * 12 + (n.getMonth() + 1 - d.mo), yrs = Math.floor(months / 12);
    const onDay = d.d && d.mo === n.getMonth() + 1 && d.d === n.getDate() && d.y < n.getFullYear();
    const ago = yrs >= 2 ? `${yrs} years ago` : yrs === 1 ? 'A year ago' : months >= 1 ? `${plural(months, 'month')} ago` : 'This month';
    return { sub: onDay ? `On this day, ${yrs === 1 ? 'a year' : yrs + ' years'} ago` : ago, title: d.d ? `${d.d} ${MONTHS[d.mo - 1]} ${d.y}` : `${MONTHS[d.mo - 1]} ${d.y}` };
  }
  function startInterlude() {
    if (interActive || !photos.length) return;
    const p = pickInterludePhoto(); if (!p) return;
    const url = thumb(p.id, 2000), tiny = thumb(p.id, 64), img = new Image();
    img.onload = () => {
      if (interActive) return;
      interActive = true;
      const w = p.w || img.naturalWidth, h = p.h || img.naturalHeight, land = w > h * 1.1, cap = interCaption(p);
      set('.js-inter-imgs', `<div class="ibg" style="background-image:url('${tiny}')"></div><div class="ifg ${land ? 'land' : 'port'}" style="background-image:url('${url}')"></div>`);
      set('.js-i-sub', esc(cap.sub)); set('.js-i-title', esc(cap.title));
      set('.js-i-bar', '<i></i>');
      const nowD = clockNow(), nxt = (data?.today || []).filter(e => !e.allDay && e.start > nowD.getTime())[0];
      if (nxt) { const mins = Math.round((nxt.start - nowD.getTime()) / 60e3); set('.js-i-next', `<span>Next, ${esc(nxt.title)} ${mins <= 90 ? 'in ' + plural(mins, 'minute') : 'at ' + ampm(new Date(nxt.start))}</span>${chip(nxt.who, nxt.color, 38)}`); } else set('.js-i-next', '');
      if (wx) set('.js-i-wx', `${svgIcon(iconName(wx.code, wx.day), 40, wx.day ? GOLD : '#C9D3E0')}<span class="tn" style="font-family:var(--serif);font-size:52px;line-height:1">${wx.temp}°</span>`);
      $('#inter').classList.add('on');
      clearTimeout(interTimer); interTimer = setTimeout(endInterlude, INTER_FOR);
    };
    img.onerror = () => { lastInter = Date.now(); };
    img.src = url;
  }
  function endInterlude() {
    clearTimeout(interTimer); $('#inter').classList.remove('on');
    setTimeout(() => { interActive = false; lastInter = Date.now(); nextPhoto(); }, 1000);
  }
  function maybeInterlude() {
    if (interActive || !photos.length || isNight() || document.hidden || DEMO && !qs.get('inter')) return;
    if (Date.now() - lastInter >= INTER_EVERY) startInterlude();
  }
  $('#inter').addEventListener('click', endInterlude);
  window.__startInterlude = startInterlude;   // for previewing: open the console and call it

  // ---------- Event moment: confetti once, on a birthday ----------
  function maybeCelebrate() {
    if (!data || document.hidden || isNight() || clockNow().getHours() < 6) return;
    const bd = birthdayToday(); if (!bd) return;
    const k = 'dash-bday', today = clockNow().toDateString();
    let done = ''; try { done = localStorage.getItem(k) || ''; } catch (e) {}
    if (done === today + bd.name && !qs.get('bday')) return;
    if ($('#confetti').childElementCount) return;
    try { localStorage.setItem(k, today + bd.name); } catch (e) {}
    const cols = ['#F2A65A', '#F0B14A', '#D7B4F0', '#9CC4FF', '#A6E0C6', '#F28C7A', '#F3ECDF'];
    let h = '';
    for (let i = 0; i < 46; i++) h += `<i style="left:${(Math.random() * 98 + 1).toFixed(1)}%;width:${8 + Math.random() * 5 | 0}px;height:${14 + Math.random() * 8 | 0}px;border-radius:${[2, 2, 7][i % 3]}px;background:${cols[i % cols.length]};animation-duration:${(5 + Math.random() * 4).toFixed(1)}s;animation-delay:${(-Math.random() * 9).toFixed(1)}s"></i>`;
    $('#confetti').innerHTML = h;
    clearTimeout(confettiTimer); confettiTimer = setTimeout(() => { $('#confetti').innerHTML = ''; }, CONFETTI_FOR);
  }

  // ---------- Layout ----------
  const DESIGN_H = 860, MIN_W = 1100;
  let fitScale = 1, fitMode = 'window';
  function viewBox() {
    const vv = window.visualViewport;
    if (vv && vv.width > 0 && vv.height > 0 && (vv.width < innerWidth * 0.98 || vv.height < innerHeight * 0.98)) { fitMode = 'visual'; return { W: vv.width, H: vv.height, x: vv.pageLeft || 0, y: vv.pageTop || 0 }; }
    fitMode = 'window'; return { W: innerWidth, H: innerHeight, x: 0, y: 0 };
  }
  function fit() {
    const { W, H, x, y } = viewBox();
    let s = H / DESIGN_H, w = W / s, h = DESIGN_H;
    if (w < MIN_W) { s = W / MIN_W; w = MIN_W; h = H / s; }
    const st = $('#stage');
    st.style.left = x + 'px'; st.style.top = y + 'px'; st.style.width = w + 'px'; st.style.height = h + 'px'; st.style.transform = `scale(${s})`;
    fitScale = s;
    if (data) renderTimeline(clockNow());
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
  $('.js-photo').addEventListener('click', () => nextPhoto());   // tap the photo to skip

  // ---------- Fully Kiosk integration (all no-ops in a normal browser) ----------
  let lastLevel = null;
  function setLevel(level) { if (!F || level === lastLevel) return; try { F.setScreenBrightness(level); lastLevel = level; } catch (e) {} }
  function lightLevel() {
    try { const lux = parseFloat(F.getSensorValue(5)); if (!isFinite(lux) || lux < 0) return null; return Math.round(20 + 235 * Math.pow(Math.min(1, Math.log10(lux + 1) / 3), 1.6)); } catch (e) { return null; }
  }
  function applyBrightness() {
    if (!F) return;
    const l = LIGHT_AUTO ? lightLevel() : null;
    if (l != null) setLevel(isNight() ? Math.min(l, NIGHT_CAP) : l); else setLevel(isNight() ? NIGHT_LEVEL : DAY_LEVEL);
  }
  window.__fridgeRefresh = function () {
    try {
      if (Date.now() - lastOk > 60e3) loadData();
      if (!wx || Date.now() - (wx.at || 0) > 5 * 60e3) loadWeather();
      applyBrightness(); render(); maybeCelebrate();
    } catch (e) {}
  };
  if (F) {
    ['screenOn', 'onMotion', 'internetReconnect', 'networkReconnect'].forEach(ev => { try { F.bind(ev, '__fridgeRefresh();'); } catch (e) {} });
    try { F.bind('pluggedAC', 'renderStatusNow();'); F.bind('unplugged', 'renderStatusNow();'); } catch (e) {}
    window.renderStatusNow = renderStatus;
  }
  document.addEventListener('contextmenu', e => e.preventDefault());

  if (qs.get('debug')) {
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;left:48px;top:520px;z-index:9;font:13px/1.45 monospace;color:#C9C0B3;background:rgba(0,0,0,.78);padding:8px 12px;border-radius:8px;white-space:pre';
    $('#stage').appendChild(d);
    const g = (fn, dflt = '?') => { try { return fn(); } catch (e) { return dflt; } };
    const upd = () => {
      d.textContent = [
        `window ${innerWidth}x${innerHeight} @${devicePixelRatio}x  ratio ${(innerWidth / innerHeight).toFixed(2)}`,
        `visual ${window.visualViewport ? Math.round(visualViewport.width) + 'x' + Math.round(visualViewport.height) + ' zoom ' + visualViewport.scale.toFixed(2) : 'n/a'}   screen ${screen.width}x${screen.height}`,
        `fit by ${fitMode}   stage scale ${fitScale.toFixed(3)}`,
        F ? `fully ${g(() => F.getFullyVersion())} / android ${g(() => F.getAndroidVersion())} / webview ${g(() => F.getWebviewVersion())}` : 'not running in Fully Kiosk',
        F ? `light sensor (lux) ${g(() => F.getSensorValue(5))}   brightness now ${g(() => F.getScreenBrightness())}   applied ${lastLevel}` : '',
        F ? `battery ${g(() => F.getBatteryLevel())}   plugged ${g(() => F.isPlugged())}` : '',
        `sun ${fmtH(SR())} to ${fmtH(SS())}   data age ${lastOk ? Math.round((Date.now() - lastOk) / 1000) + 's' : 'none'}   weather age ${wx && wx.at ? Math.round((Date.now() - wx.at) / 1000) + 's' : 'none'}`,
      ].filter(Boolean).join('\n');
    };
    upd(); setInterval(upd, 4000);
  }

  // ---------- Start ----------
  if (DEMO) $('.banner').hidden = false;
  addEventListener('resize', fit); fit();
  tick(); loadData(); loadWeather(); applyBrightness();
  setInterval(tick, 10e3);
  setInterval(applyBrightness, 60e3);
  setInterval(loadData, DATA_EVERY);
  setInterval(loadWeather, WX_EVERY);
  setInterval(nextPhoto, PHOTO_EVERY);
  setTimeout(() => location.reload(), RELOAD_EVERY);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadData(); loadWeather(); tick(); } });
})();
</script>
</body>
</html>
